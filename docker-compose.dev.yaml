volumes:
  db_dev:

networks:
  mediastack:
    external: true

services:
  security-guru-dev:
    image: security-guru:latest
    container_name: security-guru-dev
    restart: unless-stopped
    env_file:
      - .env
      - .env.development
    networks:
      - mediastack
    ports:
      - ${WEB_PORT:?err}:3333
    labels:
      - traefik.enable=true
      - traefik.http.routers.security-guru-dev.rule=Host(`securityguru-dev.${CLOUDFLARE_DNS_ZONE_DEV:?err}`)
      - traefik.http.routers.security-guru-dev.entrypoints=web
      - traefik.http.services.security-guru-dev.loadbalancer.server.scheme=http

  mongo-dev:
    image: mongo:latest
    container_name: sg-mongo-dev
    restart: unless-stopped
    networks:
      - mediastack
    ports:
      - 27018:27017
    environment:
      MONGO_INITDB_DATABASE: securityguru
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?err}
    volumes:
      - db_dev:/data/db
